    "p": "This video by a math PhD left me with the impression that what hurts so much is that while the algorithms and science behind AI are amazing, still a big component is just the amount of money(GPUs, electricity, click work exploitation...) you can throw at the problem, and that a lot of the people doing the throwing don't seem to have human good at heart or passion, but personal greed, no matter the cost, be it social, individual, or environmental."
   },
   {
    "yt": "IoW8bozMzik",
    "short": false
   }
  ],
  "t": "More impressions from the math community",
  "key": false,
  "id": 18,
  "kind": "video"
 }
];

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-");
const KIND_LABEL = { video: "Watch", post: "Post", read: "Read" };
function md(s) {
  return esc(s.replace(/\\\*/g, "\u0000").replace(/\\([_\[\]()#>])/g, "$1"))
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/&lt;(https?:\/\/[^\s&]+)&gt;/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/\u0000/g, "*");
}
/* render one news item's blocks in their original order; consecutive links share one list */
function blocksHTML(x) {
  let h = "", links = [];
  const flushLinks = () => { if (links.length) h += `<ul class="links">${links.join("")}</ul>`; links = []; };
  for (const b of x.blocks) {
    if (b.a) { links.push(`<li><a href="${esc(b.a)}" target="_blank" rel="noopener">${esc(b.label)}<span aria-hidden="true"> ↗</span></a></li>`); continue; }
    flushLinks();
    if (b.p != null) h += `<p>${md(b.p)}</p>`;
    else if (b.yt) h += `<div class="video" style="aspect-ratio:${b.short ? "9 / 16" : "16 / 9"};max-width:${b.short ? "320px" : "100%"}"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/${esc(b.yt)}" title="${esc(x.t)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>`;
    else if (b.img) h += `<a class="img" href="${esc(b.img)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(b.img)}" alt="Image shared in the newsletter"></a>`;
    else if (b.tw) h += `<blockquote class="twitter-tweet" data-dnt="true"><p class="tw-pending">Loading post by @${esc(b.h)}…</p><a href="${esc(b.tw.replace("x.com", "twitter.com"))}">View @${esc(b.h)} on X</a></blockquote>`;
  }
  flushLinks();
  return `<div class="body">${h}</div>`;
}
function loadTweets(root) { if (window.twttr && window.twttr.widgets) window.twttr.widgets.load(root); }
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  return { topics: (p.get("topics") || "").split(",").filter((t) => SECTIONS.includes(t)), format: p.get("format") || "all" };
}
function writeHash(st) {
  const p = new URLSearchParams();
  if (st.topics.length) p.set("topics", st.topics.join(","));
  if (st.format !== "all") p.set("format", st.format);
  history.replaceState(null, "", p.toString() ? "#" + p.toString() : location.pathname);
}
function matches(x, st) { return (!st.topics.length || st.topics.includes(x.s)) && (st.format === "all" || x.kind === st.format); }
</script>
<script>
const st = readHash();
const $ = (id) => document.getElementById(id);
const words = ISSUE.title.split(" ");
$("title").innerHTML = `${esc(words.slice(0, -1).join(" "))} <i>${esc(words.at(-1))}</i>`;
$("date").textContent = ISSUE.date;

/* hero: the first highlight leads; the other highlights link down to their cards */
const picks = ITEMS.filter((x) => x.key);
const lead = picks[0] || ITEMS[0];
$("lead").innerHTML = `<div class="mono"><span style="color:var(--accent)">${esc(lead.s)}</span> · Lead story</div>
  <h2 class="serif">${esc(lead.t)}</h2>${blocksHTML(lead)}`;
if (picks.length < 2) document.querySelector(".also").style.display = "none";
$("also").innerHTML = picks.filter((x) => x !== lead).map((x) =>
  `<a href="#story-${x.id}" data-jump="${x.id}"><span class="mono">${esc(x.s)}</span><h3 class="serif">${esc(x.t)}</h3></a>`).join("");

/* filters only make sense with more than one topic */
if (SECTIONS.length < 2) document.querySelector(".filters").style.display = "none";
function render() {
  writeHash(st);
  const base = ITEMS.filter((x) => x !== lead && (st.format === "all" || x.kind === st.format));
  $("topics").innerHTML = SECTIONS.map((s) =>
    `<button class="chip" type="button" data-topic="${esc(s)}" aria-pressed="${st.topics.includes(s)}">${esc(s)} · ${base.filter((x) => x.s === s).length}</button>`).join("");
  $("formats").innerHTML = [["all", "Everything"], ["video", "Videos"], ["post", "Posts"], ["read", "Articles"]]
    .map(([k, l]) => `<button class="chip f" type="button" data-format="${k}" aria-pressed="${st.format === k}">${l}</button>`).join("");
  const shown = ITEMS.filter((x) => x !== lead && matches(x, st));
  $("count").textContent = `${shown.length} stories`;
  const card = (x) => `
    <article class="card" id="story-${x.id}">
      <div class="tag mono"><span class="s">${esc(x.s)}</span><span>${x.key ? "★ " : ""}${KIND_LABEL[x.kind]}</span></div>
      <h3 class="serif">${esc(x.t)}</h3>
      ${blocksHTML(x)}
    </article>`;
  const groups = SECTIONS.map((s) => [s, shown.filter((x) => x.s === s)]).filter(([, xs]) => xs.length);
  $("grid").innerHTML = groups.length ? groups.map(([s, xs]) => `
    <section class="sec" id="${slug(s)}">
      <h2 class="serif">${esc(s)} <span class="mono">${xs.length}</span></h2>
      <div class="cards">${xs.map(card).join("")}</div>
    </section>`).join("")
    : `<p class="empty">Nothing here with these filters.</p>`;
  loadTweets($("grid"));
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-topic],[data-format],#reset,[data-jump]");
  if (!b) return;
  if (b.dataset.jump) { // make sure the target card is visible before jumping
    const x = ITEMS.find((i) => i.id === +b.dataset.jump);
    if (!matches(x, st)) { st.topics = []; st.format = "all"; render(); }
    return;
  }
  if (b.dataset.topic) { const s = b.dataset.topic; st.topics = st.topics.includes(s) ? st.topics.filter((x) => x !== s) : [...st.topics, s]; }
  else if (b.dataset.format) st.format = b.dataset.format;
  else { st.topics = []; st.format = "all"; }
  render();
});
render();
</script>
<script async src="https://platform.twitter.com/widgets.js" charset="utf-8" onload="loadTweets(document.getElementById('grid'))"></script>
</body>
</html>
